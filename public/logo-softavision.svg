<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="topBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0878ff"/>
      <stop offset="0.42" stop-color="#064fe0"/>
      <stop offset="1" stop-color="#061b78"/>
    </linearGradient>
    <linearGradient id="frontBlue" x1="0" y1="0" x2="0.9" y2="1">
