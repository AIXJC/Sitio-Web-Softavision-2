    <path d="M946 552 L1060 402 C1089 363 1123 337 1166 337 L1358 337 L1327 382 L1173 382 C1141 382 1118 399 1095 430 L982 582 C969 596 957 607 944 614 C951 595 950 572 946 552 Z" fill="url(#cyanEdge)" opacity=".92"/>
    <!-- controlled glossy highlight -->
    <path d="M168 593 C267 491 351 371 437 278 C492 219 560 220 606 266 C552 236 503 253 460 299 C367 399 277 529 168 635 Z" fill="#35a7ff" opacity=".22"/>
  </g>
